name: Enviar GitHub Trends Semanal

on:
  schedule:
    # Executa todo domingo às 12:00 UTC (9:00 no horário de Brasília)
    - cron: '0 12 * * 0'
  workflow_dispatch: # Permite testar manualmente pelo botão no GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar bot e disparar e-mail
        env:
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          SENHA_APP: ${{ secrets.SENHA_APP }}
          EMAIL_DESTINATARIO: ${{ secrets.EMAIL_DESTINATARIO }}
        run: python main.py